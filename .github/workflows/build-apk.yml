name: Build Music Libreriya APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f "$HOME/.android/debug.keystore" ./debug.keystore

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-Libreriya-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag or main push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Music Libreriya v1.0.0 (Audiophile Player APK)
          body: |
            ### 🎵 Music Libreriya - Android APK Release
            - **100 Studio Songs**: Featuring Ustad Nusrat Fateh Ali Khan, Arijit Singh, Talha Anjum, Asim Azhar, Bilal Saeed, Coke Studio, and Audiophile Classics.
            - **100% Offline Playback**: Download any track directly to your device.
            - **Real-Time Synced Karaoke Lyrics**: Tap-to-seek lyrics synchronization.
            - **5-Band Graphic Equalizer**: Custom Bass Boost & 3D Spatial Virtualizer.
            - **Sideloading Ready**: Install directly on any Android device without Google Play Store!
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
        continue-on-error: true
